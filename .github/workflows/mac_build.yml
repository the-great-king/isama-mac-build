name: Build macOS .app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-12

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install pyinstaller pyqt5 python-dotenv firebase-admin requests

    - name: Build the .app
      run: |
        source venv/bin/activate
        python3 -m PyInstaller \
          --name="Isama_Management_System" \
          --onefile \
          --windowed \
          --icon="assets/isama_icon.icns" \
          --add-data "assets:assets" \
          --add-data "firebase:firebase" \
          --add-data ".env:." \
          --add-data "ui:ui" \
          --add-data "utils:utils" \
          --add-data "models:models" \
          --add-data "screens:screens" \
          main.py

    - name: Zip the .app bundle
      run: |
        cd dist
        mkdir IsamaAppBundle
        mv Isama_Management_System.app IsamaAppBundle/
        zip -r isama_mac_build.zip IsamaAppBundle

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: isama_mac_build
        path: dist/isama_mac_build.zip
