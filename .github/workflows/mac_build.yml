name: Build macOS .app

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-macos-app:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 🔐 Inject .env and Firebase secret file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          mkdir -p firebase
          echo "${{ secrets.FIREBASE_JSON }}" > firebase/service_account.json

      - name: 🛠️ Build .app using PyInstaller
        run: |
          source venv/bin/activate
          pyinstaller --name="IsamaManagementSystem" --onefile --windowed \
            --icon="assets/isama_icon.icns" \
            --add-data "assets:assets" \
            --add-data "firebase:firebase" \
            --add-data ".env:." \
            main.py

      - name: 📦 Zip the .app
        run: |
          cd dist
          zip IsamaManagementSystem.app.zip IsamaManagementSystem

      - name: ⬆️ Upload built .app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsamaManagementSystem-macOS
          path: dist/IsamaManagementSystem.app.zip
