name: Build macOS .app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Add .env and Firebase JSON
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          mkdir -p firebase
          echo "${{ secrets.FIREBASE_JSON }}" > firebase/khosi-chat-room-firebase-adminsdk-frw9o-76ebdf2f74.json

      - name: Build .app with PyInstaller
        run: |
          source venv/bin/activate
          python3 -m PyInstaller --noconfirm --windowed --icon=assets/isama_icon.icns main.py \
            --add-data ".env:." \
            --add-data "firebase/khosi-chat-room-firebase-adminsdk-frw9o-76ebdf2f74.json:firebase"

      - name: Zip .app
        run: cd dist && zip -r isama.app.zip main.app

      - name: Upload .app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: isama-macos-app
          path: dist/isama.app.zip

