name: Build macOS .app

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller python-dotenv

      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create Firebase service account JSON
        run: |
          mkdir -p firebase
          echo '${{ secrets.FIREBASE_JSON }}' > khosi-chat-room-firebase-adminsdk-frw9o-76ebdf2f74.json

      - name: Build macOS .app
        run: |
          python3 -m PyInstaller \
            --name="Isama_Management_System" \
            --windowed \
            --icon="assets/isama_icon.icns" \
            --add-data "assets:assets" \
            --add-data "firebase:firebase" \
            --add-data ".env:." \
            --add-data "ui:ui" \
            --add-data "utils:utils" \
            --add-data "models:models" \
            --add-data "screens:screens" \
            main.py

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: IsamaManagementSystem-macOS
          path: dist/Isama_Management_System.app
