name: Build macOS .app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Create Firebase service account JSON
        run: |
          mkdir -p firebase
          echo '${{ secrets.FIREBASE_JSON }}' > firebase/khosi-chat-room-firebase-adminsdk-frw9o-76ebdf2f74.json

      - name: Build .app using PyInstaller
        run: |
          python -m PyInstaller \
            --name="Isama_Management_System" \
            --windowed \
            --icon="assets/isama_icon.icns" \
            --add-data "assets:assets" \
            --add-data "firebase:firebase" \
            --add-data ".env:." \
            --add-data "ui:ui" \
            --add-data "utils:utils" \
            --add-data "models:models" \
            --add-data "screens:screens" \
            main.py

      - name: Zip the .app properly for macOS
        run: |
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent "dist/Isama_Management_System.app" "output/Isama_Management_System.zip"

      - name: Upload the zipped .app
        uses: actions/upload-artifact@v4
        with:
          name: isama-macos-app
          path: output/Isama_Management_System.zip
