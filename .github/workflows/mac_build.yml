name: Build macOS .app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-dotenv pyrebase4 PySide6

      - name: Build .app
        run: |
          python -m PyInstaller \
            --name="Isama_Management_System" \
            --windowed --onefile \
            --icon="assets/isama_icon.icns" \
            --add-data "assets:assets" \
            --add-data "firebase:firebase" \
            --add-data ".env:." \
            --add-data "ui:ui" \
            --add-data "utils:utils" \
            --add-data "models:models" \
            --add-data "screens:screens" \
            main.py

      - name: Upload .app artifact
        uses: actions/upload-artifact@v3
        with:
          name: Isama_Management_System-macOS
          path: dist/Isama_Management_System
